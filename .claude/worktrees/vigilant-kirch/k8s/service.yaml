apiVersion: v1
kind: Service
metadata:
  # Service interno para descoberta estável dos Pods do KubeForge.
  name: kubeforge
  labels:
    app: kubeforge
spec:
  selector:
    app: kubeforge
  ports:
  - name: http
    # Porta do Service no cluster.
    port: 8080
    # Porta real do container da aplicação.
    targetPort: 8000
    protocol: TCP
  # Exposição apenas interna; entrada externa via Ingress.
  type: ClusterIP
