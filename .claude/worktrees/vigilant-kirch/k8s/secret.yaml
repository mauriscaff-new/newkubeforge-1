apiVersion: v1
kind: Secret
metadata:
  # Secret para dados sensíveis de infraestrutura.
  name: kubeforge-secret
type: Opaque
# stringData evita encode manual em base64 no versionamento.
stringData:
  REDIS_URL: "redis://SUBSTITUA_USUARIO:SUBSTITUA_SENHA@redis.kubeforge-system.svc.cluster.local:6379/0"
